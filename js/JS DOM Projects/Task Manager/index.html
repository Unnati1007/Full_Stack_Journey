<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskMaster Pro</title>
    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Google Fonts (Poppins) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <i class="fas fa-tasks task-icon"></i>
            <h1>TaskMaster Pro</h1>
            <p class="subtitle">Your Personal Task Management Solution ⭐</p>
        </div>
        
        <!-- Input Section -->
        <div class="input-section">
            <div class="input-wrapper">
                <i class="fas fa-pencil-alt input-icon"></i>
                <input type="text" id="task-input" placeholder="Enter your task" />
            </div>
            <button id="add-task-btn">
                <i class="fas fa-plus"></i> Add Task
            </button>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">
                <i class="fas fa-list-ul"></i> All
            </button>
            <button class="filter-btn" data-filter="completed">
                <i class="fas fa-check"></i> Completed
            </button>
            <button class="filter-btn" data-filter="pending">
                <i class="far fa-clock"></i> Pending
            </button>
        </div>

        <!-- Task List -->
        <ul class="task-list" id="task-list">
            <!-- Sample Tasks for styling preview -->
            <li class="task-item">
                <span class="task-text">Coding</span>
                <div class="task-actions">
                    <button class="action-btn complete-btn"><i class="fas fa-check"></i></button>
                    <button class="action-btn delete-btn"><i class="fas fa-trash"></i></button>
                </div>
            </li>
            <li class="task-item">
                <span class="task-text">Going for dinner</span>
                <div class="task-actions">
                    <button class="action-btn complete-btn"><i class="fas fa-check"></i></button>
                    <button class="action-btn delete-btn"><i class="fas fa-trash"></i></button>
                </div>
            </li>
            <li class="task-item">
                <span class="task-text">Travelling</span>
                <div class="task-actions">
                    <button class="action-btn complete-btn"><i class="fas fa-check"></i></button>
                    <button class="action-btn delete-btn"><i class="fas fa-trash"></i></button>
                </div>
            </li>
        </ul>
    </div>
    <!-- Custom JS -->
    <script src="script.js" defer></script>
</body>
</html>
