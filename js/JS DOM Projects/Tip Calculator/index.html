<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split & Share - Tip Calculator</title>
    <!-- Use a modern font like Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Split & Share</h1>
            <p>The smart way to calculate and split bills with friends. Perfect for dining out, group activities, or shared expenses. Get instant calculations with fair splits and detailed breakdowns.</p>
        </header>

        <main class="calculator-container">
            <!-- Left Panel: Inputs -->
            <section class="input-panel">
                <div class="input-group">
                    <label for="bill-amount"><i class="fa-solid fa-receipt"></i> BILL AMOUNT</label>
                    <input type="number" id="bill-amount" placeholder="Enter the total bill amount" min="0" step="0.01">
                </div>

                <div class="input-group">
                    <label for="service-rating"><i class="fa-solid fa-star"></i> SERVICE RATING</label>
                    <select id="service-rating">
                        <option value="0.20">Exceptional - 20%</option>
                        <option value="0.15">Good - 15%</option>
                        <option value="0.10">Average - 10%</option>
                        <option value="0.05">Poor - 5%</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="number-people"><i class="fa-solid fa-users"></i> NUMBER OF PEOPLE</label>
                    <input type="number" id="number-people" value="1" min="1">
                </div>

                <button class="calculate-btn" id="calculate-btn">
                    <i class="fa-solid fa-calculator"></i> Calculate Split
                </button>
            </section>

            <!-- Right Panel: Breakdown -->
            <section class="breakdown-panel">
                <h2>Breakdown</h2>
                <div class="results-grid">
                    <div class="result-card">
                        <span>Tip Amount</span>
                        <div class="amount" id="tip-amount">$0.00</div>
                    </div>
                    <div class="result-card">
                        <span>Total Bill</span>
                        <div class="amount" id="total-bill">$0.00</div>
                    </div>
                    <div class="result-card">
                        <span>Per Person</span>
                        <div class="amount" id="per-person">$0.00</div>
                    </div>
                    <div class="result-card">
                        <span>Tip Per Person</span>
                        <div class="amount" id="tip-per-person">$0.00</div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
