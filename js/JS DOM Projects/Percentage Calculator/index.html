<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Custom JS -->
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="calculator-header">
                <h1>Percentage Calculator</h1>
                <p>Simple and precise calculations</p>
            </div>
            
            <div class="calculator-body">
                <div class="input-section">
                    <div class="input-group">
                        <label for="number">Amount</label>
                        <div class="input-wrapper">
                            <input type="number" id="number" placeholder="0.00" />
                            <span class="input-icon">$</span>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="percent">Percentage</label>
                        <div class="input-wrapper">
                            <input type="number" id="percent" placeholder="0" />
                            <span class="input-icon">%</span>
                        </div>
                    </div>
                    
                    <button id="calculateBtn">Calculate</button>
                </div>
                
                <div class="results">
                    <h3>Results</h3>
                    <div class="result-grid">
                        <div class="result-item">
                            <span class="result-label">Percentage Amount</span>
                            <span class="result-value" id="percentageResult">$0.00</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">Final Amount</span>
                            <span class="result-value" id="finalResult">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
