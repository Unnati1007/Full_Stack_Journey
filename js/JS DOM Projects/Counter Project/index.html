<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .counter-display {
            font-size: 5rem;
            border: 4px solid #a5f368; /* Light green border like the image */
            border-radius: 8px;
            display: inline-block;
            padding: 0px 30px;
            line-height: 1.2;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-white">

    <div class="card shadow-sm" style="width: 28rem;">
        <div class="card-header bg-light py-3 border-bottom">
            <h1 class="h3 mb-0 text-dark text-center fw-semibold">Counter App</h1>
        </div>
        <div class="card-body text-center p-4">
            <p class="card-text text-dark mb-4">This is a simple counter application. Use the buttons to increase, decrease, or reset the counter value.</p>
            
            <div class="counter-display text-dark mb-4" id="counter-value">0</div>
            
            <div class="d-flex justify-content-center gap-3">
                <button class="btn btn-success px-3 py-2 fw-medium" id="btn-increase">Increase</button>
                <button class="btn btn-danger px-3 py-2 fw-medium" id="btn-decrease" style="background-color: #d9534f; border-color: #d9534f;">Decrease</button>
                <button class="btn btn-secondary px-4 py-2 fw-medium" id="btn-reset">Reset</button>
            </div>
        </div>
    </div>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
