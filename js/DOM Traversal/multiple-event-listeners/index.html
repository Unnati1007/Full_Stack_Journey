<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Event Listeners</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #actionButton {
            background-color: #559e4e;
            color: #ffffff;
            border: none;
            padding: 20px 45px;
            font-size: 28px;
            cursor: pointer;
            border-radius: 16px;
            transition: background-color 0.2s ease;
        }

        #actionButton:hover {
            background-color: #468640;
        }
    </style>
</head>

<body>
    <button id="actionButton">Click Me!</button>

    <script src="script.js"></script>
</body>

</html>
