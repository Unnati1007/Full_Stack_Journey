<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fruit List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #fruitList {
            list-style: none;
            padding: 20px;
            margin: 0;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 320px;
        }

        li {
            padding: 10px 15px;
            margin: 8px 0;
            background-color: #f9f9f9;
            border-radius: 4px;
            border-left: 4px solid #3b82f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
            text-align: center;
            min-height: 24px;
        }
    </style>
</head>

<body>
    <ul id="fruitList">
        <!-- Fruits will be inserted here -->
    </ul>

    <div id="message"></div>
    <script src="script.js"></script>
</body>

</html>
