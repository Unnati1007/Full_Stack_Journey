<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remove Event Listener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            gap: 12px;
        }

        button {
            background-color: #559e4e;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 12px;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #468640;
        }
    </style>
</head>

<body>
    <button id="alertButton">Show Alert</button>
    <button id="removeButton">Remove Alert Event</button>

    <script src="script.js"></script>
</body>

</html>
