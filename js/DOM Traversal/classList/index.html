<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>classList Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #textElement {
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            margin: 0 0 10px 0;
            transition: all 0.3s ease;
        }

        button {
            background-color: #559e4e;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #468640;
        }

        .highlight {
            background-color: #ffeaa7;
            color: #d63031;
            font-weight: bold;
        }

        .active {
            background-color: #0984e3;
            color: #ffffff;
            border-color: #74b9ff;
        }

        .bold {
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }
    </style>
</head>

<body>
    <div id="container">
        <p id="textElement">Modify my class!</p>
        <button onclick="addClass()">Add Class</button>
        <button onclick="removeClass()">Remove Class</button>
        <button onclick="toggleClass()">Toggle Class</button>
        <button onclick="replaceClass()">Replace Class</button>
        <button onclick="checkContains()">Contains Class</button>
        <button onclick="listItem()">List Item</button>
        <button onclick="getValue()">Get Value</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
