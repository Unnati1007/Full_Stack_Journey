<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stop Propagation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #outerDiv {
            background-color: #559e4e;
            padding: 20px 25px;
            border-radius: 12px;
            text-align: center;
            color: #000000;
            font-size: 16px;
            cursor: pointer;
        }

        #middleDiv {
            background-color: #4a8c43;
            padding: 20px 25px;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
        }

        #innerDiv {
            background-color: #3f7939;
            padding: 20px 30px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="outerDiv">
        Outer Div
        <div id="middleDiv">
            Middle Div
            <div id="innerDiv">Inner Div</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
