<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Replacing Elements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #articleContainer {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 320px;
        }

        .article {
            padding: 10px;
            margin: 8px 0;
            background-color: #f9f9f9;
            border-radius: 4px;
            border-left: 4px solid #3b82f6;
        }
    </style>
</head>

<body>
    <div id="articleContainer">
        <div class="article" id="article1">This is Article 1.</div>
        <div class="article" id="article2">This is Article 2.</div>
        <div class="article" id="article3">This is Article 3.</div>
    </div>
    <script src="script.js"></script>
</body>

</html>
