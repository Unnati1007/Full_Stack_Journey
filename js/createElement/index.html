<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic To-Do</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #container {
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .todo-item {
            background: #e2e8f0;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            border-left: 4px solid #007bff;
            text-align: left;
        }
    </style>
</head>

<body>
    <div id="container">
        <h2>Dynamic To-Do</h2>
        <!-- Tasks will be appended here -->
    </div>
    <script src="script.js"></script>
</body>

</html>
